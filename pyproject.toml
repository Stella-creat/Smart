[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart"
version = "0.1.0"
description = "智能知识库与个性化学习管理系统 — 业务层（DeepTutor 适配壳）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]
# NOTE: DeepTutor 作为运行时可选依赖，需单独 `pip install -e` 过 DeepTutor 源码目录。
# 未安装时 DeepTutorProvider 会自动降级到规则匹配实现。

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]

[project.scripts]
smart = "smart.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
